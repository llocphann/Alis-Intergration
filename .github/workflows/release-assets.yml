name: Release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing v* tag to package and publish to GitHub Releases'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build deterministic base and per-plugin release tarballs
        run: python3 scripts/build-release-assets.py --out-dir dist

      - name: Verify release asset inventory and SHA256SUMS
        run: |
          test -f dist/alis-intergration-base.tar.gz
          test -f dist/SHA256SUMS
          python3 - <<'PY'
          import json
          import pathlib
          import tarfile

          manifest = json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))
          base_asset = pathlib.Path("dist/alis-intergration-base.tar.gz")
          with tarfile.open(base_asset, "r:gz") as tf:
              base_names = set(tf.getnames())
              for required in ("alis-intergration-base/manifest.json", "alis-intergration-base/AlisSession.qml"):
                  assert required in base_names, f"Missing {required} in {base_asset}"

          for plugin in manifest["plugins"]:
              plugin_id = plugin["id"]
              asset = pathlib.Path(f"dist/alis-intergration-plugin-{plugin_id}.tar.gz")
              assert asset.is_file(), f"Missing release asset: {asset}"
              prefix = f"plugins/{plugin_id}/"
              with tarfile.open(asset, "r:gz") as tf:
                  names = tf.getnames()
                  assert any(name == f"plugins/{plugin_id}" or name.startswith(prefix) for name in names), (
                      f"Release asset {asset} missing expected payload under {prefix}"
                  )
          PY
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alis-intergration-release-assets
          path: |
            dist/alis-intergration-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Refusing to publish non-version tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/alis-intergration-*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/alis-intergration-*.tar.gz dist/SHA256SUMS \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
