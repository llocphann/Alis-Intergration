[package]
name = "alis-files"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native GTK4 file manager tailored for the Alis desktop environment"

[[bin]]
name = "alis-files"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rayon = "1.10"
regex = "1.11"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = "symbols"
